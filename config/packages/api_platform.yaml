api_platform:
    title: Api
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    
    formats:
        json: ['application/json']
    
    swagger:
        persist_authorization: true
        api_keys:
            apiKey:
                name: Authorization
                type: header

